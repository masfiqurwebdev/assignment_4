<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <title>Job Application Tracker</title>
  <link rel="stylesheet" href="style.css">
  <script src="https://kit.fontawesome.com/8075efb750.js" crossorigin="anonymous"></script>

</head>
<body>

<div class="container">
  <h2>Job Application Tracker</h2>

  <!-- Stats -->
  <div class="stats">
    <div class="box ">Total <h3 id="total">0</h3></div>
    <div class="box ">Interview <h3 class="green1" id="interview">0</h3></div>
    <div class="box">Rejected <h3 class="red1" id="rejected">0</h3></div>
  </div>

  <!-- Tabs -->
  <div class="tabs">
    <button class="tab active" data-filter="all">All</button>
    <button class="tab" data-filter="interview">Interview</button>
    <button class="tab" data-filter="rejected">Rejected</button>
  </div>

  <!-- Jobs -->
  <div id="jobList"></div>
  <img src="" alt="">
</div>
  <script src="script.js"></script>
</body>
</html>
